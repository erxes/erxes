# Root fields use the communicationMessaging* namespace.
# Names following query/mutation/subscription are client document labels;
# fields inside the selection sets are the public schema contract.
# All 8 queries, 12 mutations and 1 subscription are covered below.
# See README.md for variables, responses and the compatibility policy.

query communicationMessagingProfileExample {
  communicationMessagingMe {
    app {
      id
      direct
      group
      attachments
      push
    }
    member {
      id
      displayName
    }
  }
}

query communicationMessagingMemberDirectoryExample($first: Int, $after: ID) {
  communicationMessagingMembers(first: $first, after: $after) {
    items {
      id
      displayName
    }
    nextCursor
  }
}

query communicationMessagingConversationListExample(
  $first: Int
  $after: String
) {
  communicationMessagingConversations(first: $first, after: $after) {
    items {
      id
      kind
      title
      role
      lastSequence
      lastReadSequence
      unreadCount
    }
    nextCursor
  }
}

query communicationMessagingConversationDetailExample($id: ID!) {
  communicationMessagingConversation(id: $id) {
    id
    kind
    title
    role
    lastSequence
    lastReadSequence
    unreadCount
  }
}

query communicationMessagingHistoryExample(
  $conversationId: ID!
  $first: Int
  $before: Int
) {
  communicationMessagingMessages(
    conversationId: $conversationId
    first: $first
    before: $before
  ) {
    items {
      id
      conversationId
      senderId
      clientMessageId
      sequence
      text
      attachmentIds
      mentionMemberIds
      createdAt
    }
    nextCursor
  }
}

query communicationMessagingGroupParticipantsExample($conversationId: ID!) {
  communicationMessagingParticipants(conversationId: $conversationId) {
    member {
      id
      displayName
    }
    role
    lastReadSequence
    typingUntil
  }
}

query communicationMessagingOfflineSyncExample($after: Int!, $first: Int) {
  communicationMessagingSync(after: $after, first: $first) {
    cursor
    hasMore
    resetRequired
    items {
      id
      cursor
      conversationId
      kind
      message {
        id
        conversationId
        senderId
        clientMessageId
        sequence
        text
        attachmentIds
        mentionMemberIds
        createdAt
      }
    }
  }
}

query communicationMessagingBadgeExample {
  communicationMessagingUnreadCount
}

mutation communicationMessagingEnrollExample($displayName: String!) {
  communicationMessagingRegister(displayName: $displayName) {
    app {
      id
      direct
      group
      attachments
      push
    }
    member {
      id
      displayName
    }
  }
}

mutation communicationMessagingStartDirectExample($peerId: ID!) {
  communicationMessagingOpenDirect(peerId: $peerId) {
    id
    kind
    role
    lastSequence
    lastReadSequence
    unreadCount
  }
}

mutation communicationMessagingNewGroupExample(
  $title: String!
  $memberIds: [ID!]!
) {
  communicationMessagingCreateGroup(title: $title, memberIds: $memberIds) {
    id
    kind
    title
    role
    lastSequence
    lastReadSequence
    unreadCount
  }
}

mutation communicationMessagingGroupMembershipExample(
  $conversationId: ID!
  $action: CommunicationMessagingGroupAction!
  $memberId: ID
) {
  communicationMessagingChangeGroup(
    conversationId: $conversationId
    action: $action
    memberId: $memberId
  )
}

mutation communicationMessagingSendMessageExample(
  $input: CommunicationMessagingSendInput!
) {
  communicationMessagingSend(input: $input) {
    id
    conversationId
    senderId
    clientMessageId
    sequence
    text
    attachmentIds
    mentionMemberIds
    createdAt
  }
}

mutation communicationMessagingReadPositionExample(
  $conversationId: ID!
  $through: Int!
) {
  communicationMessagingMarkRead(
    conversationId: $conversationId
    through: $through
  )
}

mutation communicationMessagingTypingStatusExample(
  $conversationId: ID!
  $typing: Boolean!
) {
  communicationMessagingTyping(conversationId: $conversationId, typing: $typing)
}

mutation communicationMessagingPrepareFileExample(
  $conversationId: ID!
  $name: String!
  $mimeType: String!
  $size: Int!
) {
  communicationMessagingPrepareAttachment(
    conversationId: $conversationId
    name: $name
    mimeType: $mimeType
    size: $size
  ) {
    id
    uploadPath
  }
}

mutation communicationMessagingDeviceRegistrationExample(
  $installationId: String!
  $platform: CommunicationMessagingPlatform!
  $token: String!
) {
  communicationMessagingRegisterDevice(
    installationId: $installationId
    platform: $platform
    token: $token
  ) {
    id
    installationId
    platform
  }
}

mutation communicationMessagingDeviceLogoutExample($installationId: String!) {
  communicationMessagingRevokeDevice(installationId: $installationId)
}

mutation communicationMessagingNotificationPreferenceExample(
  $conversationId: ID!
  $preference: CommunicationMessagingPreference!
) {
  communicationMessagingPreference(
    conversationId: $conversationId
    preference: $preference
  )
}

mutation communicationMessagingSocketTicketExample {
  communicationMessagingSubscriptionTicket {
    ticket
    expiresAt
  }
}

subscription communicationMessagingLiveExample($ticket: String!) {
  communicationMessagingWake(ticket: $ticket)
}
