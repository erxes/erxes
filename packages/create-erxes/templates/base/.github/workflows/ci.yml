# erxes core's plugin CI, which reads this repository's files to decide what runs: static checks,
# tests on Postgres, the image and its vulnerability scan, and with deploy/docker-compose.yml and
# e2e/playwright.config.ts the smoke test and the daily flows on core's published images.
# Require the `Check` job in branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request supersedes its running checks; branch runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: erxes/erxes/.github/workflows/plugin-ci.yml@postgre
    secrets: inherit

  check:
    # Green only when every job of the plugin CI passed.
    name: Check
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.ci.result }}
