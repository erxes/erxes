# pnpm, Node from .node-version, and the workspace's node_modules. A run whose lockfile, patches
# and Node match a postgre run restores node_modules whole and skips `pnpm install`; a miss
# installs. Only branch runs (pushes, a manual run) save, so pull requests never evict
# postgre's copy from the 10 GB cache, as the images job's layer cache does.
name: Node and dependencies
description: pnpm, Node and node_modules, restored from postgre's cache when the lockfile matches.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
    # The pnpm version package.json pins, straight from npm. pnpm/action-setup installs its
    # own pnpm first and then switches to the pinned one, which took 8.5 s.
    - shell: bash
      run: npm install --global --no-fund --no-audit "$(jq -r .packageManager package.json)"
    - id: modules
      uses: actions/cache/restore@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: steps.modules.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      uses: actions/cache/save@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
