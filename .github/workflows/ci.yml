# erxes core: static checks, tests on Postgres, builds, container images and a
# smoke test of the whole stack. Images go to GHCR on pushes to postgre once
# everything passes. Require the `Check` job in branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [postgre, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request supersedes its running checks; branch runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI never commits, so `pnpm install` skips installing the git hooks.
  VP_GIT_HOOKS: '0'

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, lint, types and knip
        run: pnpm check
      - name: Migrations and openapi.json match the schema and contract
        run: pnpm check:generated
      - name: Applied migrations unchanged
        run: pnpm --filter @erxes/core-db db:check-applied "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Lint plugin tests
        run: pnpm exec vp test run --project lint
      - name: No critical advisories in production dependencies
        run: pnpm audit --prod --audit-level critical

  integration:
    name: Tests on Postgres and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erxes
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erxes_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erxes -d erxes_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests (each API test file creates its own database and acts as a role without BYPASSRLS)
        run: pnpm test
        env:
          DATA_TEST_URL: postgres://erxes:ci-only-password@127.0.0.1:5432/erxes_ci
      - name: Build the API and the UI
        run: pnpm build

  images:
    name: Images and smoke test
    needs: [static, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Image names
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/$owner/erxes-core-api" >> "$GITHUB_OUTPUT"
          echo "ui=ghcr.io/$owner/erxes-core-ui" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/core-api/Dockerfile
          load: true
          tags: ${{ steps.names.outputs.api }}:${{ steps.names.outputs.sha }}
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,scope=core-api,mode=max
      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/core-ui/Dockerfile
          load: true
          tags: ${{ steps.names.outputs.ui }}:${{ steps.names.outputs.sha }}
          cache-from: type=gha,scope=core-ui
          cache-to: type=gha,scope=core-ui,mode=max
      - name: Start the stack
        env:
          CORE_API_IMAGE: ${{ steps.names.outputs.api }}:${{ steps.names.outputs.sha }}
          CORE_UI_IMAGE: ${{ steps.names.outputs.ui }}:${{ steps.names.outputs.sha }}
        run: |
          deploy/make-secrets.sh
          {
            echo "DATA_OWNER_PASSWORD=$(openssl rand -hex 16)"
            echo "DATA_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "CORE_API_IMAGE=$CORE_API_IMAGE"
            echo "CORE_UI_IMAGE=$CORE_UI_IMAGE"
          } > deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
      - name: Smoke test
        run: deploy/smoke.sh http://localhost:8080
      - name: Stack logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color --tail 300 || true
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/postgre'
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          for image in '${{ steps.names.outputs.api }}' '${{ steps.names.outputs.ui }}'; do
            docker tag "$image:${{ steps.names.outputs.sha }}" "$image:postgre"
            docker push "$image:${{ steps.names.outputs.sha }}"
            docker push "$image:postgre"
          done

  check:
    # The job to require. It fails when any job above failed, was cancelled or was skipped.
    name: Check
    needs: [static, integration, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
