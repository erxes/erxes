# erxes core: static checks, tests on Postgres, builds, TLA+ model checks, container
# images with a vulnerability scan, a smoke test of the whole stack, the daily flows
# in Chromium on it, and the packed shared packages checked outside the workspace.
# All run side by side except the flows, which start once the images are built;
# images go to GHCR and Docker Hub on pushes to postgre only after all of them pass.
# Require the `Check` job in branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [postgre, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request supersedes its running checks; branch runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI never commits, so `pnpm install` skips installing the git hooks.
  VP_GIT_HOOKS: '0'

jobs:
  static:
    name: Static checks and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # What the applied-migrations check compares with: the pull request's or merge group's base, or the push's previous head.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the base commit (only its migrations are read)
        if: env.BASE_SHA != '' && env.BASE_SHA != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: The deploy stack keeps Postgres off the host's ports
        run: |
          docker compose -f deploy/docker-compose.yml config --no-interpolate --format json |
            jq -e '[.services[] | select(.image | startswith("postgres")) | select(.ports or .network_mode == "host")] == []' > /dev/null ||
            { echo "::error file=deploy/docker-compose.yml::the postgres service publishes a port to the host"; exit 1; }
      - uses: ./.github/actions/setup
      - name: Format, lint, types, React Doctor and knip
        run: pnpm exec vp run check
      # A deliberate raise is a rule change in its own PR, labelled gate-change.
      - name: No bundle budget grew against the base
        if: env.BASE_SHA != '' && env.BASE_SHA != '0000000000000000000000000000000000000000' && !contains(github.event.pull_request.labels.*.name, 'gate-change')
        run: node tools/check-escapes.ts "$BASE_SHA"
      - name: Migrations, routes.json and cn tables match their sources
        run: pnpm check:generated
      - name: Applied migrations unchanged
        run: pnpm --filter @erxes/core-db db:check-applied "$BASE_SHA"
      - name: Lint plugin tests
        run: pnpm exec vp test run --project lint
      - name: No critical advisories in production dependencies
        run: pnpm audit --prod --audit-level critical
      - name: Build the API and the UI
        run: pnpm build

  integration:
    name: Tests on Postgres (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The tests are the longest job; four runners split them.
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DATA_TEST_URL: postgres://erxes:ci-only-password@127.0.0.1:5432/erxes_ci
    steps:
      # Pulled and started in the background, not as a service, so it boots while the checkout and
      # dependencies restore; the ready check below waits for it.
      - name: Postgres 18
        run: >-
          nohup docker run -d --name postgres -p 5432:5432
          -e POSTGRES_USER=erxes -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB=erxes_ci postgres:18
          > "$RUNNER_TEMP/postgres.log" 2>&1 &
      # A pull request's checkout is its merge commit; its first parent is the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: Postgres accepts connections
        run: timeout 60 sh -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U erxes -d erxes_ci 2>/dev/null; do sleep 1; done; cat "$RUNNER_TEMP/postgres.log"'
      # What lets queries rely on withOrg() instead of org filters (tools/check-rls.sql).
      - name: Migrated schema has forced row level security on every org_id table and core_ names
        if: matrix.shard == 1
        run: pnpm check:rls
      # A pull request runs the test files its changes reach through imports, and every file when it
      # changes an input vite.config.ts's forceRerunTriggers lists. Pushes run every file.
      - name: Tests (API test files run in parallel, each on its own database as a role without BYPASSRLS)
        run: pnpm exec vp run test --shard=${{ matrix.shard }}/4 ${{ github.event_name == 'pull_request' && '--changed=HEAD^1 --passWithNoTests' || '' }}

  models:
    name: TLA+ models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          filter: blob:none
      - id: reach
        name: Does the pull request change a model or its checker?
        run: tools/pr-reaches.sh '^(verify/|tools/verify-models\.sh)'
      # The pinned Java and tla2tools.jar; the script checks their checksums either way.
      - if: steps.reach.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/erxes-verify
          key: tla-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/verify-models.sh') }}
      - name: Real designs pass, broken designs fail
        if: steps.reach.outputs.run == 'true'
        run: tools/verify-models.sh
      - name: Keep TLC's output and counterexample traces
        if: always() && steps.reach.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tlc-traces
          path: .scratch/tlc/*.log
          if-no-files-found: ignore

  images:
    # Builds the two images once and hands them to the flows' shards before anything else, then
    # scans them and runs the smoke test on its own copy of the deploy stack.
    name: Images, scan and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # docker-bake.hcl's tags; the compose stacks run them.
      API_IMAGE: erxes-api:local
      WEB_IMAGE: erxes-web:local
      # Branch runs (pushes to postgre, a manual run) write the layer cache; pull requests
      # and the merge queue only read postgre's. Every ref writes its own copy of each
      # dependency layer (about 0.5 GB), so writes from pull requests filled the
      # repository's 10 GB cache, evicted postgre's layers and cost each run a minute of upload.
      CACHE_WRITE: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The runner is thrown away after the job.
          cleanup: false
      - name: Build both images side by side
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            web.cache-from=type=gha,scope=web
            ${{ env.CACHE_WRITE == 'true' && 'api.cache-to=type=gha,scope=api,mode=max' || '' }}
            ${{ env.CACHE_WRITE == 'true' && 'web.cache-to=type=gha,scope=web,mode=max' || '' }}
      - name: Save both images for the flows' shards
        run: docker save "$API_IMAGE" "$WEB_IMAGE" | zstd -T0 -3 -q -o "$RUNNER_TEMP/images.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: ${{ runner.temp }}/images.tar.zst
          compression-level: 0
          retention-days: 1
      - name: Start the stack while Trivy finds no HIGH or CRITICAL vulnerabilities that have a fix
        run: |
          deploy/make-secrets.sh
          {
            echo "DATA_OWNER_PASSWORD=$(openssl rand -hex 16)"
            echo "DATA_APP_PASSWORD=$(openssl rand -hex 16)"
          } > deploy/.env
          UI_PORT=8081 APP_URL=http://localhost:8081 docker compose -f deploy/docker-compose.yml --env-file deploy/.env -p erxes-smoke up -d > "$RUNNER_TEMP/smoke-up.log" 2>&1 &
          smoke=$!
          for image in "$API_IMAGE" "$WEB_IMAGE"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
          status=0
          wait "$smoke" || status=$?
          cat "$RUNNER_TEMP/smoke-up.log"
          exit "$status"
      - name: Smoke test
        run: deploy/smoke.sh http://localhost:8081
      - name: The web image reaches a recreated API at its new address
        run: deploy/web-proxy-test.sh "$WEB_IMAGE"
      - name: Stack logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env -p erxes-smoke logs --no-color --tail 300 || true

  flows:
    # The daily flows (e2e/*.spec.ts in Chromium with an axe check on every page they visit) on
    # the images job's images, split over three runners, each with its own deploy stack on :8080.
    name: Daily flows in Chromium (${{ matrix.shard }}/3)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      API_IMAGE: erxes-api:local
      WEB_IMAGE: erxes-web:local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: images
          path: ${{ runner.temp }}
      - name: Start the stack
        run: |
          zstd -d -q -c "$RUNNER_TEMP/images.tar.zst" | docker load -q
          deploy/make-secrets.sh
          {
            echo "DATA_OWNER_PASSWORD=$(openssl rand -hex 16)"
            echo "DATA_APP_PASSWORD=$(openssl rand -hex 16)"
          } > deploy/.env
          docker compose -f deploy/docker-compose.yml -f e2e/docker-compose.e2e.yml --env-file deploy/.env up -d
      - uses: ./.github/actions/setup
      - name: Chromium (headless shell) and its system libraries
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Wait for the stack
        run: timeout 120 sh -c 'until curl -fsS http://localhost:8080/core/v1/setup >/dev/null; do sleep 2; done'
      - name: Daily flows, light and dark, with axe
        run: pnpm e2e --shard=${{ matrix.shard }}/3
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Traces and screenshots of failed specs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 14
      - name: Stack logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color --tail 300 || true

  packages:
    # A package that only works inside the monorepo (an import of an undeclared
    # dependency, a file missing from `files`) fails here, before it is published.
    name: Packed packages install and work outside the workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A plugin create-erxes generates runs its own tests and tenancy guard.
    env:
      DATA_TEST_URL: postgres://erxes:ci-only-password@127.0.0.1:5432/erxes_ci
    steps:
      # Pulled and started in the background, not as a service, so it boots while the checkout and
      # dependencies restore; the ready check below waits for it.
      - name: Postgres 18
        run: >-
          nohup docker run -d --name postgres -p 5432:5432
          -e POSTGRES_USER=erxes -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB=erxes_ci postgres:18
          > "$RUNNER_TEMP/postgres.log" 2>&1 &
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          filter: blob:none
      - id: reach
        name: Does the pull request change a package or a consumer?
        run: tools/pr-reaches.sh '^(packages/|consumers/)'
      - if: steps.reach.outputs.run == 'true'
        uses: ./.github/actions/setup
      - name: Build and pack @erxes/ui, @erxes/core-contract, @erxes/plugin-sdk, @erxes/lint and create-erxes
        if: steps.reach.outputs.run == 'true'
        run: |
          filters=(--filter @erxes/ui --filter @erxes/core-contract --filter @erxes/plugin-sdk --filter @erxes/lint --filter create-erxes)
          pnpm "${filters[@]}" build
          pnpm "${filters[@]}" exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"
      - name: A plugin UI and a plugin server build against the tarballs
        if: steps.reach.outputs.run == 'true'
        run: consumers/run.sh "$RUNNER_TEMP/packs"
      - name: Postgres accepts connections
        if: steps.reach.outputs.run == 'true'
        run: timeout 60 sh -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U erxes -d erxes_ci 2>/dev/null; do sleep 1; done; cat "$RUNNER_TEMP/postgres.log"'
      - name: New and migrated plugins from create-erxes pass their own gates against the tarballs
        if: steps.reach.outputs.run == 'true'
        run: pnpm exec vp test run --project create-erxes-e2e
        env:
          CREATE_ERXES_PACKS: ${{ runner.temp }}/packs

  check:
    # The job to require. It fails when any job above failed, was cancelled or was skipped.
    name: Check
    needs: [static, integration, models, images, flows, packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  push:
    # Rebuilt from the images job's layer cache, so these are the images that were scanned and smoke tested.
    name: Push images to GHCR and Docker Hub
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/postgre'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "registry=ghcr.io/$owner"
            echo "hub=docker.io/erxes"
            echo "sha=sha-${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"
      - name: Push both images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          push: true
          # A target's first `tags=` replaces docker-bake.hcl's tag, the others add one.
          # Docker Hub's names are core-api/core-web: erxes/erxes-api is erxes 3.x's.
          set: |
            api.cache-from=type=gha,scope=api
            web.cache-from=type=gha,scope=web
            api.tags=${{ steps.names.outputs.registry }}/erxes-api:${{ steps.names.outputs.sha }}
            api.tags=${{ steps.names.outputs.registry }}/erxes-api:postgre
            api.tags=${{ steps.names.outputs.hub }}/core-api:${{ steps.names.outputs.sha }}
            api.tags=${{ steps.names.outputs.hub }}/core-api:postgre
            web.tags=${{ steps.names.outputs.registry }}/erxes-web:${{ steps.names.outputs.sha }}
            web.tags=${{ steps.names.outputs.registry }}/erxes-web:postgre
            web.tags=${{ steps.names.outputs.hub }}/core-web:${{ steps.names.outputs.sha }}
            web.tags=${{ steps.names.outputs.hub }}/core-web:postgre
