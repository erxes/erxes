# erxes core: static checks, tests on Postgres, builds, TLA+ model checks, container
# images with a vulnerability scan and a smoke test of the whole stack, and the
# packed shared packages checked outside the workspace, and the daily flows in
# Chromium on the smoke test's stack. The six run side by side; images go to GHCR
# on pushes to postgre only after all of them pass.
# Require the `Check` job in branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [postgre, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request supersedes its running checks; branch runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI never commits, so `pnpm install` skips installing the git hooks.
  VP_GIT_HOOKS: '0'

jobs:
  static:
    name: Static checks and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # What the applied-migrations check compares with: the pull request's or merge group's base, or the push's previous head.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the base commit (only its migrations are read)
        if: env.BASE_SHA != '' && env.BASE_SHA != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: The deploy stack keeps Postgres off the host's ports
        run: |
          docker compose -f deploy/docker-compose.yml config --no-interpolate --format json |
            jq -e '[.services[] | select(.image | startswith("postgres")) | select(.ports or .network_mode == "host")] == []' > /dev/null ||
            { echo "::error file=deploy/docker-compose.yml::the postgres service publishes a port to the host"; exit 1; }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, lint, types and knip
        run: pnpm exec vp run check
      # A deliberate raise is a rule change in its own PR, labelled gate-change.
      - name: No bundle budget grew against the base
        if: env.BASE_SHA != '' && env.BASE_SHA != '0000000000000000000000000000000000000000' && !contains(github.event.pull_request.labels.*.name, 'gate-change')
        run: node tools/check-escapes.ts "$BASE_SHA"
      - name: Migrations and openapi.json match the schema and contract
        run: pnpm check:generated
      - name: Applied migrations unchanged
        run: pnpm --filter @erxes/core-db db:check-applied "$BASE_SHA"
      - name: Lint plugin tests
        run: pnpm exec vp test run --project lint
      - name: No critical advisories in production dependencies
        run: pnpm audit --prod --audit-level critical
      - name: Build the API and the UI
        run: pnpm build

  integration:
    name: Tests on Postgres (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The tests are the longest job; two runners halve them.
    strategy:
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: erxes
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erxes_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erxes -d erxes_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATA_TEST_URL: postgres://erxes:ci-only-password@127.0.0.1:5432/erxes_ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # What lets queries rely on withOrg() instead of org filters (tools/check-rls.sql).
      - name: Migrated schema has forced row level security on every org_id table and core_ names
        if: matrix.shard == 1
        run: pnpm check:rls
      - name: Tests (API test files run in parallel, each on its own database as a role without BYPASSRLS)
        run: pnpm exec vp run test --shard=${{ matrix.shard }}/2

  models:
    name: TLA+ models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The pinned Java and tla2tools.jar; the script checks their checksums either way.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/erxes-verify
          key: tla-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/verify-models.sh') }}
      - name: Real designs pass, broken designs fail
        run: tools/verify-models.sh
      - name: Keep TLC's output and counterexample traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tlc-traces
          path: .scratch/tlc/*.log
          if-no-files-found: ignore

  images:
    name: Images, scan and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # docker-bake.hcl's tags; the compose stack runs them.
      API_IMAGE: erxes-api:local
      WEB_IMAGE: erxes-web:local
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The runner is thrown away after the job.
          cleanup: false
      - name: Build both images side by side
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max
      - name: No HIGH or CRITICAL vulnerabilities that have a fix
        run: |
          for image in "$API_IMAGE" "$WEB_IMAGE"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
      - name: Start the stack
        run: |
          deploy/make-secrets.sh
          {
            echo "DATA_OWNER_PASSWORD=$(openssl rand -hex 16)"
            echo "DATA_APP_PASSWORD=$(openssl rand -hex 16)"
          } > deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
      - name: Smoke test
        run: deploy/smoke.sh http://localhost:8080
      - name: Stack logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color --tail 300 || true

  packages:
    # A package that only works inside the monorepo (an import of an undeclared
    # dependency, a file missing from `files`) fails here, before it is published.
    name: Packed packages install and work outside the workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A plugin create-erxes generates runs its own tests and tenancy guard.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: erxes
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erxes_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erxes -d erxes_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATA_TEST_URL: postgres://erxes:ci-only-password@127.0.0.1:5432/erxes_ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and pack @erxes/ui, @erxes/core-contract, @erxes/plugin-sdk and create-erxes
        run: |
          filters=(--filter @erxes/ui --filter @erxes/core-contract --filter @erxes/plugin-sdk --filter create-erxes)
          pnpm "${filters[@]}" build
          pnpm "${filters[@]}" exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"
      - name: A plugin UI and a plugin server build against the tarballs
        run: consumers/run.sh "$RUNNER_TEMP/packs"
      - name: New and migrated plugins from create-erxes pass their own gates against the tarballs
        run: pnpm exec vp test run --project create-erxes-e2e
        env:
          CREATE_ERXES_PACKS: ${{ runner.temp }}/packs

  e2e:
    # The daily flows (e2e/*.spec.ts) in Chromium with an axe check on every page they visit,
    # against the same stack as the smoke test. A new runner is a fresh database: the specs
    # seed their synthetic data through the API.
    name: Daily flows in Chromium, light and dark, with axe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_IMAGE: erxes-api:local
      WEB_IMAGE: erxes-web:local
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - name: Build both images from the images job's layer cache
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            web.cache-from=type=gha,scope=web
      - name: Start the stack
        run: |
          deploy/make-secrets.sh
          {
            echo "DATA_OWNER_PASSWORD=$(openssl rand -hex 16)"
            echo "DATA_APP_PASSWORD=$(openssl rand -hex 16)"
          } > deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium (headless shell) and its system libraries
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Wait for the stack
        run: timeout 120 sh -c 'until curl -fsS http://localhost:8080/core/v1/setup >/dev/null; do sleep 2; done'
      - name: Daily flows
        run: pnpm e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Traces and screenshots of failed specs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: e2e/test-results/
          retention-days: 14
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color --tail 300 || true

  check:
    # The job to require. It fails when any job above failed, was cancelled or was skipped.
    name: Check
    needs: [static, integration, models, images, packages, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  push:
    # Rebuilt from the images job's layer cache, so these are the images that were scanned and smoke tested.
    name: Push images to GHCR
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/postgre'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "registry=ghcr.io/$owner"
            echo "sha=sha-${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"
      - name: Push both images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          push: true
          # A target's first `tags=` replaces docker-bake.hcl's tag, the second adds one.
          set: |
            api.cache-from=type=gha,scope=api
            web.cache-from=type=gha,scope=web
            api.tags=${{ steps.names.outputs.registry }}/erxes-api:${{ steps.names.outputs.sha }}
            api.tags=${{ steps.names.outputs.registry }}/erxes-api:postgre
            web.tags=${{ steps.names.outputs.registry }}/erxes-web:${{ steps.names.outputs.sha }}
            web.tags=${{ steps.names.outputs.registry }}/erxes-web:postgre
