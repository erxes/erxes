# erxes core: static checks, tests on Postgres, builds, container images with a
# vulnerability scan and a smoke test of the whole stack. The three run side by
# side; images go to GHCR on pushes to postgre only after all of them pass.
# Require the `Check` job in branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [postgre, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request supersedes its running checks; branch runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI never commits, so `pnpm install` skips installing the git hooks.
  VP_GIT_HOOKS: '0'

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # What the applied-migrations check compares with: the pull request's or merge group's base, or the push's previous head.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the base commit (only its migrations are read)
        if: env.BASE_SHA != '' && env.BASE_SHA != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: The deploy stack keeps Postgres off the host's ports
        run: |
          docker compose -f deploy/docker-compose.yml config --no-interpolate --format json |
            jq -e '[.services[] | select(.image | startswith("postgres")) | select(.ports or .network_mode == "host")] == []' > /dev/null ||
            { echo "::error file=deploy/docker-compose.yml::the postgres service publishes a port to the host"; exit 1; }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, lint, types and knip
        run: pnpm check
      - name: Migrations and openapi.json match the schema and contract
        run: pnpm check:generated
      - name: Applied migrations unchanged
        run: pnpm --filter @erxes/core-db db:check-applied "$BASE_SHA"
      - name: Lint plugin tests
        run: pnpm exec vp test run --project lint
      - name: No critical advisories in production dependencies
        run: pnpm audit --prod --audit-level critical

  integration:
    name: Tests on Postgres and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erxes
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erxes_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erxes -d erxes_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests (API test files run in parallel, each on its own database as a role without BYPASSRLS)
        run: pnpm test
        env:
          DATA_TEST_URL: postgres://erxes:ci-only-password@127.0.0.1:5432/erxes_ci
      - name: Build the API and the UI
        run: pnpm build

  images:
    name: Images, scan and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CORE_API_IMAGE: erxes-core-api:ci
      CORE_UI_IMAGE: erxes-core-ui:ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/core-api/Dockerfile
          load: true
          tags: ${{ env.CORE_API_IMAGE }}
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,scope=core-api,mode=max
      - name: Build UI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/core-ui/Dockerfile
          load: true
          tags: ${{ env.CORE_UI_IMAGE }}
          cache-from: type=gha,scope=core-ui
          cache-to: type=gha,scope=core-ui,mode=max
      - name: No HIGH or CRITICAL vulnerabilities that have a fix
        run: |
          for image in "$CORE_API_IMAGE" "$CORE_UI_IMAGE"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
      - name: Start the stack
        run: |
          deploy/make-secrets.sh
          {
            echo "DATA_OWNER_PASSWORD=$(openssl rand -hex 16)"
            echo "DATA_APP_PASSWORD=$(openssl rand -hex 16)"
          } > deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
      - name: Smoke test
        run: deploy/smoke.sh http://localhost:8080
      - name: Stack logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color --tail 300 || true

  check:
    # The job to require. It fails when any job above failed, was cancelled or was skipped.
    name: Check
    needs: [static, integration, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  push:
    # Rebuilt from the images job's layer cache, so these are the images that were scanned and smoke tested.
    name: Push images to GHCR
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/postgre'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "api=ghcr.io/$owner/erxes-core-api"
            echo "ui=ghcr.io/$owner/erxes-core-ui"
            echo "sha=sha-${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"
      - name: Push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/core-api/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.api }}:${{ steps.names.outputs.sha }}
            ${{ steps.names.outputs.api }}:postgre
          cache-from: type=gha,scope=core-api
      - name: Push UI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/core-ui/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.ui }}:${{ steps.names.outputs.sha }}
            ${{ steps.names.outputs.ui }}:postgre
          cache-from: type=gha,scope=core-ui
