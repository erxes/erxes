name: help-center-ci

on:
  push:
    branches:
      - main
    paths:
      - 'apps/help-center/**'
      - 'frontend/libs/erxes-ui/src/**'
      - '.github/workflows/ci-apps-help-center.yml'
  pull_request:
    paths:
      - 'apps/help-center/**'
      - 'frontend/libs/erxes-ui/src/**'
      - '.github/workflows/ci-apps-help-center.yml'

jobs:
  help-center:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Set environment variables
        run: |
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build
        run: |
          cd apps/help-center
          rm -rf node_modules
          npm ci --ignore-scripts
          ln -sfn apps/help-center/node_modules "$GITHUB_WORKSPACE/node_modules"
          npm run build

      - name: Build docker image
        if: github.event_name == 'push' && ( github.ref == 'refs/heads/main')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          DOCKER_BUILDKIT=1 docker build \
            -t erxes/help-center:latest \
            -t "erxes/help-center:$DATE-$SHORT_SHA" \
            -f apps/help-center/Dockerfile .
          docker push erxes/help-center:latest
          docker push "erxes/help-center:$DATE-$SHORT_SHA"
