name: KNOWLEDGE-BASE CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/knowledge-base/**'
      - 'frontend/libs/erxes-ui/src/**'
      - '.github/workflows/ci-apps-knowledge-base.yml'
  pull_request:
    paths:
      - 'apps/knowledge-base/**'
      - 'frontend/libs/erxes-ui/src/**'
      - '.github/workflows/ci-apps-knowledge-base.yml'

jobs:
  knowledge-base:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      # The portal compiles a few components out of the erxes-ui source tree,
      # and those files resolve their own imports by walking up from
      # frontend/libs to a root node_modules — which only a pnpm workspace
      # install creates. This job installs the app alone, so the app's own
      # node_modules is published at the root for that walk to find. The
      # Dockerfile does the same thing for the same reason.
      - name: Build
        run: |
          cd apps/knowledge-base
          rm -rf node_modules
          npm ci --ignore-scripts
          ln -sfn apps/knowledge-base/node_modules "$GITHUB_WORKSPACE/node_modules"
          npm run build
        env:
          NEXT_PUBLIC_ERXES_API_URL: https://example.erxes.io/gateway

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: apps/knowledge-base/Dockerfile
          push: true
          tags: erxes/knowledge-base:latest
          build-args: |
            NEXT_PUBLIC_ERXES_API_URL=${{ secrets.KNOWLEDGE_BASE_API_URL }}
