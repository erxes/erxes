# Builds a backend plugin image from a plugin release tag, e.g.
# `loyalty_api@1.2.0` -> erxes/erxes-next-loyalty_api:1.2.0.
# Built from the tagged commit instead of re-tagging :latest, which another
# CI run may have overwritten.
name: Release plugin

on:
  push:
    tags:
      - '*_api@*'

env:
  NX_DAEMON: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Parse tag
        run: |
          echo "PLUGIN=${GITHUB_REF_NAME%@*}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#*@}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared module
        run: pnpm nx build erxes-api-shared

      - name: Build ${{ env.PLUGIN }}
        run: pnpm nx build ${{ env.PLUGIN }}

      # Most plugins live in backend/plugins/<name>_api; some run from
      # backend/services/<name>. Take the folder from the Nx project.
      - name: Find ${{ env.PLUGIN }} folder
        run: |
          pnpm nx show project ${{ env.PLUGIN }} --json > "$RUNNER_TEMP/project.json"
          echo "PROJECT_ROOT=$(node -p "require('$RUNNER_TEMP/project.json').root")" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (multi-platform)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.PROJECT_ROOT }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: erxes/erxes-next-${{ env.PLUGIN }}:${{ env.VERSION }}
