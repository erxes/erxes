# Publishes the shared libraries plugins build against:
#   backend/erxes-api-shared -> @erxes/api-shared
#   frontend/libs/erxes-ui   -> @erxes/ui
#   frontend/libs/ui-modules -> @erxes/ui-modules
# All three always share one version. Plugins install them under aliases,
# e.g. "erxes-ui": "npm:@erxes/ui@~3.2.25".
#
# Channels:
#   next    every push to main that touches a library -> X.Y.Z-next.N, dist-tag `next`
#           (X.Y.Z = root package.json version, or its next patch once that
#           version is released as stable)
#   release pushing a platform release tag (e.g. `3.2.25`, same tag as
#           release.yml) -> X.Y.Z, dist-tag `latest`
# Breaking library API changes need at least a minor version bump of the
# platform, and a removed field should stay one release as an optional
# @deprecated member first.
name: Publish shared libs

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]*'
    paths:
      - 'backend/erxes-api-shared/**'
      - 'frontend/libs/erxes-ui/**'
      - 'frontend/core-ui/src/styles.css'
      - 'frontend/libs/ui-modules/**'
      - '.github/workflows/publish-shared-libs.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'next = prerelease from main, release = stable version'
        required: true
        type: choice
        options:
          - next
          - release
        default: next
      version:
        description: 'Stable version to publish (release channel only, e.g. 3.2.25)'
        required: false
        type: string
      dry_run:
        description: 'Build, verify, pack and stage without publishing to npm'
        required: false
        type: boolean
        default: false
      otp:
        description: 'npm one-time password (leave empty when using an automation token)'
        required: false
        type: string

env:
  NX_DAEMON: false

concurrency:
  group: publish-shared-libs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-shared-libs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@53751a9789c7351e4924f01fe68370252a4f1f18 # v2.4.1
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Compute publish version
        id: version
        env:
          CHANNEL: ${{ github.ref_type == 'tag' && 'release' || github.event.inputs.channel || 'next' }}
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
        run: |
          node -e '
            const { execFileSync } = require("child_process");
            const { appendFileSync } = require("fs");
            const names = ["@erxes/api-shared", "@erxes/ui", "@erxes/ui-modules"];
            const published = names.flatMap((name) => {
              try {
                const out = execFileSync("npm", ["view", name, "versions", "--json"]).toString().trim();
                const versions = JSON.parse(out || "[]");
                return Array.isArray(versions) ? versions : [versions];
              } catch (e) {
                const t = `${e.stdout || ""}${e.stderr || ""}${e.message}`;
                if (t.includes("E404")) return [];
                throw e;
              }
            });
            const stable = /^(\d+)\.(\d+)\.(\d+)$/;
            const channel = process.env.CHANNEL;
            let version;
            let distTag;

            if (channel === "release") {
              version = (process.env.RELEASE_VERSION || "").trim();
              if (!stable.test(version)) {
                throw new Error(`release version must look like 3.2.25, got "${version}"`);
              }
              if (published.includes(version)) {
                throw new Error(`${version} is already published`);
              }
              distTag = "latest";
            } else {
              let base = require("./package.json").version;
              const [, major, minor, patch] = stable.exec(base);
              // Prereleases must sort above the newest stable release.
              if (published.includes(base)) base = `${major}.${minor}.${Number(patch) + 1}`;
              const re = new RegExp("^" + base.replace(/\./g, "\\.") + "-next\\.(\\d+)$");
              const n = Math.max(0, ...published.map((v) => Number((re.exec(v) || [])[1] || 0)));
              version = `${base}-next.${n + 1}`;
              distTag = "next";
            }

            const [, major, minor, patch] = /^(\d+)\.(\d+)\.(\d+)/.exec(version);
            // ui-modules accepts any erxes-ui build of the same minor line.
            const peerRange = `>=${major}.${minor}.${patch}-0 <${major}.${Number(minor) + 1}.0`;
            const out = process.env.GITHUB_OUTPUT;
            appendFileSync(out, `version=${version}\ndist_tag=${distTag}\npeer_range=${peerRange}\n`);
            console.log(`publish ${version} as ${distTag} (erxes-ui peer ${peerRange})`);
          '

      - name: Test libraries
        run: pnpm nx run-many -t test -p erxes-ui ui-modules erxes-api-shared

      - name: Build libraries
        run: |
          set -euo pipefail
          rm -rf backend/erxes-api-shared/dist frontend/libs/erxes-ui/dist frontend/libs/ui-modules/dist
          pnpm nx build erxes-api-shared
          test -f backend/erxes-api-shared/dist/erxes-api-shared.cjs.js

          pnpm nx build erxes-ui
          pnpm --filter erxes-ui test:package

          # Type errors are tolerated (consumers use skipLibCheck), but a
          # declaration-emit error (TS4xxx/TS9xxx) drops whole files from
          # dist/ and silently removes exports, so it fails the publish.
          # ui-modules resolves erxes-ui through its built declarations.
          for lib in ui-modules; do
            log="$RUNNER_TEMP/$lib-dts.log"
            pnpm --filter "$lib" run build:dts > "$log" 2>&1 || true
            cat "$log"
            if grep -E "error TS(4|9)[0-9]{3}" "$log"; then
              echo "::error::$lib declaration emit is incomplete"
              exit 1
            fi
            test -f "frontend/libs/$lib/dist/index.d.ts"
          done

      - name: Pack and stage libraries
        env:
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
          PEER_RANGE: ${{ steps.version.outputs.peer_range }}
        run: |
          set -euo pipefail
          WORK="$GITHUB_WORKSPACE/tmp/shared-libs-publish"

          stage() {
            local dir="$1" npm_name="$2" source_dir="${3:-$1}"
            rm -rf "$WORK/pack" && mkdir -p "$WORK/pack"
            (cd "$dir" && pnpm pack --pack-destination "$WORK/pack")

            local staged="$WORK/staged/$npm_name"
            rm -rf "$staged" && mkdir -p "$staged"
            tar -xzf "$WORK"/pack/*.tgz -C "$staged" --strip-components=1

            (cd "$staged" && \
              npm pkg set "name=$npm_name" "version=$PUBLISH_VERSION" \
                "publishConfig.access=public" \
                "repository.type=git" \
                "repository.url=git+https://github.com/erxes/erxes.git" \
                "repository.directory=$source_dir" && \
              npm pkg delete devDependencies scripts)
            echo "staged $npm_name@$PUBLISH_VERSION at $staged"
          }

          stage backend/erxes-api-shared @erxes/api-shared
          stage frontend/libs/erxes-ui/dist @erxes/ui frontend/libs/erxes-ui
          stage frontend/libs/ui-modules @erxes/ui-modules

          (cd "$WORK/staged/@erxes/ui-modules" && \
            npm pkg set "peerDependencies.erxes-ui=$PEER_RANGE")

          rm -rf "$WORK/pack"

      - name: Publish to npm
        if: github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
          OTP: ${{ github.event.inputs.otp }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          set -euo pipefail
          for dir in tmp/shared-libs-publish/staged/@erxes/*/; do
            npm publish "$dir" --tag "$DIST_TAG" --access public ${OTP:+--otp="$OTP"}
          done

      - name: Dry-run publish to npm
        if: github.event.inputs.dry_run == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
          OTP: ${{ github.event.inputs.otp }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          set -euo pipefail
          for dir in tmp/shared-libs-publish/staged/@erxes/*/; do
            npm publish "$dir" --tag "$DIST_TAG" --access public --dry-run ${OTP:+--otp="$OTP"}
            npm pack "$dir" --pack-destination tmp/shared-libs-publish
          done
          ls -l tmp/shared-libs-publish/*.tgz

      - name: Upload staged packages
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shared-libs-staged
          path: tmp/shared-libs-publish/
          if-no-files-found: ignore
