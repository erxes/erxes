name: CI plugin--communication_ui

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]*'
    paths:
      - 'frontend/plugins/communication_ui/**'
      - 'frontend/libs/**'
      - '.github/workflows/ci-ui-communication.yml'
  pull_request:
    paths:
      - 'frontend/plugins/communication_ui/**'
      - 'frontend/libs/**'
      - '.github/workflows/ci-ui-communication.yml'
      - 'backend/core-api/src/**'
      - 'backend/plugins/*/src/**'
      - 'backend/erxes-api-shared/src/**'
      - 'backend/gateway/compose-schema.ts'
      - 'backend/gateway/src/subscription/genTypeDefs.ts'
      - 'backend/*/project.json'
      - 'backend/plugins/*/project.json'
      - 'scripts/print-subgraph-schema.ts'
      - 'nx.json'

permissions:
  contents: read

env:
  NX_DAEMON: false
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  communication_ui-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Communication UI
        run: pnpm nx lint communication_ui

      - name: Build Communication UI
        env:
          NODE_ENV: production
        run: pnpm nx build communication_ui

      - name: Sync to Cloudflare R2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            communication_folder="$GITHUB_REF_NAME"
          else
            communication_folder="latest"
          fi
          aws s3 sync dist/frontend/plugins/communication_ui "s3://erxes-next/$communication_folder/communication_ui/" \
            --endpoint-url https://7c8392aff8ac4518aa06dfa4b6337ef2.r2.cloudflarestorage.com
