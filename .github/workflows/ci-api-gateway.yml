name: CI Gateway

on:
  push:
    branches:
      - main
      - fix/3.2.7.1-erkhet-remainders
    paths:
      - 'backend/gateway/**'
      - 'backend/erxes-api-shared/**'
      - '.github/workflows/ci-api-gateway.yml'
  pull_request:
    paths:
      - 'backend/gateway/**'
      - 'backend/erxes-api-shared/**'
      - '.github/workflows/ci-api-gateway.yml'

jobs:
  gateway-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install ${{ github.ref == 'refs/heads/fix/3.2.7.1-erkhet-remainders' && '--frozen-lockfile' || '' }}

      - name: Set environment variables
        run: |
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build shared module
        run: |
          export NX_DAEMON=false
          pnpm nx build erxes-api-shared ${{ github.ref == 'refs/heads/fix/3.2.7.1-erkhet-remainders' && '--excludeTaskDependencies' || '' }}

      - name: Build hotfix gateway
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/3.2.7.1-erkhet-remainders'
        run: NX_DAEMON=false pnpm nx build gateway --excludeTaskDependencies

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/3.2.7.1-erkhet-remainders')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          export NX_DAEMON=false
          pnpm nx docker-build gateway
          docker tag erxes/erxes-next-gateway erxes/erxes-next-gateway:latest
          docker tag erxes/erxes-next-gateway erxes/erxes-next-gateway:${{ github.sha }}
          docker push erxes/erxes-next-gateway:latest
          docker push erxes/erxes-next-gateway:${{ github.sha }}

      - name: Build and push hotfix gateway image
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/3.2.7.1-erkhet-remainders'
        run: |
          docker build -f backend/gateway/Dockerfile . -t erxes/erxes-next-gateway:3.2.7.1
          docker push erxes/erxes-next-gateway:3.2.7.1
