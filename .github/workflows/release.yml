# Publishes @erxes/core-contract, @erxes/plugin-sdk, @erxes/ui, @erxes/lint and create-erxes
# to npm under the `v2-next` dist-tag. Releases go out only through npm trusted publishing
# from this workflow file: each package has a trusted publisher on npmjs.com pointing at
# erxes/erxes and release.yml, npm exchanges the job's OIDC token for a one-time publish
# token, and adds provenance itself. No npm token is stored anywhere. Trusted publishing
# needs npm 11.5.1 or later; every Node 26 release (.node-version) ships 11.12.1 or later.
# Versions are bumped in a PR, never here. A version already on npm is skipped, so a rerun
# publishes only what is missing.
# @erxes/ui's `latest` and `next` belong to old erxes's 3.x (publish-shared-libs.yml
# on main, tags `[0-9]*`); this workflow never moves them.
name: Release

on:
  push:
    tags: ['v2-*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm trusted publishing

jobs:
  publish:
    name: Publish to npm (v2-next)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No registry-url: it would write an _authToken line to .npmrc, and npm finds the
      # registry and the OIDC token on its own.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (tsdown checks each package with publint and attw) and pack
        run: |
          filters=(--filter @erxes/core-contract --filter @erxes/plugin-sdk --filter @erxes/ui --filter @erxes/lint --filter create-erxes)
          pnpm "${filters[@]}" build
          pnpm "${filters[@]}" exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"
      - name: Publish each version npm does not have yet
        run: |
          # Dependencies first: plugin-sdk needs core-contract, and a plugin create-erxes makes
          # installs the other four. The first failure stops the run; a rerun skips what went out.
          for name in erxes-core-contract erxes-plugin-sdk erxes-ui erxes-lint create-erxes; do
            tgz=$(echo "$RUNNER_TEMP/packs/$name"-[0-9]*.tgz)
            manifest=$(tar -xzOf "$tgz" package/package.json)
            spec="$(jq -r .name <<<"$manifest")@$(jq -r .version <<<"$manifest")"
            if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
              echo "$spec is already on npm, skipped"
              continue
            fi
            npm publish "$tgz" --tag v2-next --access public || { echo "::error::$spec failed to publish"; exit 1; }
          done
