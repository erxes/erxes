packages:
  - apps/*
  - packages/*

# Install scripts pnpm may run. esbuild's checks its platform binary; the others only print notices.
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  protobufjs: false

# Vite+ runs its own Vite build and Vitest version; dependencies must resolve to the same ones.
overrides:
  'vite@*': 'npm:@voidzero-dev/vite-plus-core@1.6.0'
  'vitest@*': '5.1.0'
  # cn does what clsx and tailwind-merge do, with the same exports; dependencies that import
  # them (BlockNote, cva, recharts) get cn, so the bundle carries one class merger.
  'clsx': 'npm:cn@0.5.2'
  'tailwind-merge': 'npm:cn@0.5.2'

patchedDependencies:
  '@dnd-kit/core@6.3.1': patches/@dnd-kit__core@6.3.1.patch
  drizzle-zod@0.8.3: patches/drizzle-zod@0.8.3.patch
