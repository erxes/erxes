# erxes core on one host: Postgres, a one-shot migration, the API and the UI.
# CI starts this stack as its smoke test; it is also a starting point for a
# single-server install (see deploy/README.md).
#
#   cp deploy/.env.example deploy/.env      # then fill it in
#   deploy/make-secrets.sh                  # signing key + random secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# The API connects as `erxes_app` (no BYPASSRLS, data only); migrations run
# as the database owner. Leave out the postgres service to use a managed
# database (Supabase, RDS): set DATA_URL / DATA_MIGRATION_URL to it instead.
name: erxes-core

x-api-env: &api-env
  NODE_ENV: production
  APP_URL: ${APP_URL:-http://localhost:8080}
  DATA_URL: postgres://erxes_app:${DATA_APP_PASSWORD:?set DATA_APP_PASSWORD}@postgres:5432/erxes
  DATA_MIGRATION_URL: postgres://erxes:${DATA_OWNER_PASSWORD:?set DATA_OWNER_PASSWORD}@postgres:5432/erxes
  DATA_RUNTIME_ROLE: erxes_app
  DATA_SSL: ${DATA_SSL:-false}
  CORE_JWT_SECRET_FILE: /run/secrets/core_jwt_secret
  CORE_ENCRYPTION_KEY_FILE: /run/secrets/core_encryption_key
  CORE_SIGNING_KEY_FILE: /run/secrets/core_signing_key
  CORE_SETUP: ${CORE_SETUP:-true}
  FILES_STORAGE: ${FILES_STORAGE:-local}
  FILES_LOCAL_DIR: /app/data/files
  # Unset: SMTP when EMAIL_SMTP_URL is set, else nothing is delivered (Settings › Integrations › Email sending).
  EMAIL_DRIVER: ${EMAIL_DRIVER:-}
  EMAIL_SMTP_URL: ${EMAIL_SMTP_URL:-}
  EMAIL_FROM: ${EMAIL_FROM:-}

x-api-secrets: &api-secrets
  - core_jwt_secret
  - core_encryption_key
  - core_signing_key

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # Parallel queries share memory through /dev/shm; Docker's 64 MB default makes big
    # sorts and hash joins fail ("could not resize shared memory segment"). A ceiling, not a
    # reservation.
    shm_size: 1g
    # Postgres' defaults fit 128 MB of RAM and spinning disks. These fit a server with 4 GB
    # or more and an SSD: a 200,000-customer organisation is about 760 MB, so it stays in
    # memory, and the planner prices an index read close to a sequential one. Lower
    # shared_buffers and effective_cache_size on a smaller host.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    environment:
      POSTGRES_USER: erxes
      POSTGRES_PASSWORD: ${DATA_OWNER_PASSWORD:?set DATA_OWNER_PASSWORD}
      POSTGRES_DB: erxes
      DATA_APP_PASSWORD: ${DATA_APP_PASSWORD:?set DATA_APP_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erxes -d erxes']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${API_IMAGE:-ghcr.io/erxes/erxes-api:postgre}
    command: ['node', 'dist/migrate.js']
    environment: *api-env
    secrets: *api-secrets
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: ${API_IMAGE:-ghcr.io/erxes/erxes-api:postgre}
    restart: unless-stopped
    environment: *api-env
    secrets: *api-secrets
    volumes:
      - files:/app/data
    depends_on:
      migrate: { condition: service_completed_successfully }

  ui:
    image: ${WEB_IMAGE:-ghcr.io/erxes/erxes-web:postgre}
    restart: unless-stopped
    environment:
      CORE_API_URL: http://api:3400
    ports:
      - '${UI_PORT:-8080}:8080'
    depends_on:
      api: { condition: service_healthy }

secrets:
  core_jwt_secret:
    file: ./secrets/core_jwt_secret
  core_encryption_key:
    file: ./secrets/core_encryption_key
  core_signing_key:
    file: ./secrets/core_signing_key.pem

volumes:
  postgres:
  files:
