# Public platform GraphQL contract snapshot consumed by tourism UI.
# Each block is copied from the subgraph SDL named above it and lists only what tourism documents select.
# This is codegen input, not tourism API SDL.

# backend/core-api/src/modules/organization/team-member/graphql/schema.ts

extend type User {
  details: UserDetailsType
}

# backend/core-api/src/modules/organization/team-member/graphql/schema.ts

type UserDetailsType {
  avatar: String
  fullName: String
}

# backend/core-api/src/modules/products/graphql/schemas/category.ts

extend type Query {
  productCategories(
    ids: [String]
    parentId: String
    withChild: Boolean
    searchValue: String
    status: String
    meta: String
    brandIds: [String]
  ): [ProductCategory]
}

# backend/core-api/src/modules/products/graphql/schemas/category.ts

type ProductCategory {
  _id: String!
  name: String
  parentId: String
  code: String!
  order: String!
  productCount: Int
}

# backend/plugins/payment_api/src/modules/payment/graphql/schemas/payment.ts

extend type Query {
  payments(status: String, kind: String): [Payment]
}

# backend/plugins/payment_api/src/modules/payment/graphql/schemas/payment.ts

enum PaymentMethodStatus {
  active
  inactive
}

# backend/plugins/payment_api/src/modules/payment/graphql/schemas/payment.ts

type Payment {
  _id: String!
  name: String!
  kind: String!
  status: PaymentMethodStatus
  config: JSON
  createdAt: Date
}

# backend/plugins/loyalty_api/src/modules/pricing/graphql/schemas/pricingPlan.ts

extend type Query {
  pricingPlans(
    status: String
    priority: String
    branchId: String
    departmentId: String
    productId: String
    date: Date
    findOne: Boolean
    page: Int
    perPage: Int
    sortField: String
    sortDirection: Int
    isQuantityEnabled: Boolean
    isPriceEnabled: Boolean
    isExpiryEnabled: Boolean
    isRepeatEnabled: Boolean
    totalAmount: String
    quantity: Float
  ): [PricingPlan]
}

# backend/plugins/loyalty_api/src/modules/pricing/graphql/schemas/pricingPlan.ts

type PricingPlan {
  _id: String
  name: String
  status: String
  type: String
  value: Float
}
