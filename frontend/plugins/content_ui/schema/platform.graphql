# Public platform GraphQL contract snapshot consumed by content UI.
# Core-api blocks are copied from the core-api subgraph SDL; lists only what content documents select.
# This is codegen input, not content API SDL.

# erxes-private/backend/plugins/agent_api (not in this repository; hand-written from the field content selects)

extend type Query {
  agentPostizTenantEnabled: Boolean
}

# backend/core-api/src/modules/clientportal/graphql/schemas/clientPortal.ts

extend type Query {
  getClientPortals(filter: IClientPortalFilter): ClientPortalListResponse
}

# backend/core-api/src/modules/clientportal/graphql/schemas/clientPortal.ts

type ClientPortal {
  _id: String!
  createdAt: Date
  description: String
  domain: String
  name: String!
  token: String
  updatedAt: Date
}

# backend/core-api/src/modules/clientportal/graphql/schemas/clientPortal.ts

type ClientPortalListResponse {
  list: [ClientPortal]
  pageInfo: PageInfo
  totalCount: Int
}

# backend/core-api/src/modules/clientportal/graphql/schemas/clientPortal.ts

input IClientPortalFilter {
  _id: String
  limit: Int
  cursor: String
  cursorMode: CURSOR_MODE
  direction: CURSOR_DIRECTION
  orderBy: JSON
  sortMode: String
  aggregationPipeline: [JSON]
}

# backend/core-api/src/modules/organization/team-member/graphql/schema.ts

extend type User {
  details: UserDetailsType
  email: String
  username: String
}

# backend/core-api/src/modules/organization/team-member/graphql/schema.ts

type UserDetailsType {
  avatar: String
  firstName: String
  fullName: String
  lastName: String
  middleName: String
  shortName: String
}
